name: Build Skinly APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Skinly V2
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*_v2.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Skinly V2 ZIP tidak ditemukan."
            exit 1
          fi

          echo "Menggunakan: $ZIP"
          mkdir -p skinly_build
          unzip -q "$ZIP" -d skinly_build

          PROJECT=$(find skinly_build -name settings.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "Project Android tidak ditemukan."
            exit 1
          fi

          echo "Project ditemukan di: $PROJECT"
          echo "$PROJECT" > project_path.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Skinly V2
        run: |
          PROJECT=$(cat project_path.txt)
          cd "$PROJECT"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          PROJECT=$(cat project_path.txt)
          test -f "$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Skinly V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Skinly-V2-debug-apk
          path: |
            skinly_build/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
