name: Build Skinly APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Skinly project
        run: |
          mkdir skinly_source
          unzip -q SkinlyV1_GitHubActions.zip -d skinly_source

      - name: Build APK
        working-directory: skinly_source/SkinlyV1_GHA
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skinly-debug-apk
          path: skinly_source/SkinlyV1_GHA/app/build/outputs/apk/debug/app-debug.apk
